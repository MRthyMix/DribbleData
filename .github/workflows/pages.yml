name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # VITE_API_URL is a repository variable (Settings → Secrets and variables →
      # Actions → Variables) holding the Vercel API URL, e.g. https://dribbledata.vercel.app
      - name: Build
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # GitHub Pages has no SPA rewrites: serve index.html for unknown paths
      # so deep links like /DribbleData/player?name=... still load the app.
      - run: cp ../static/dist/index.html ../static/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: static/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
